
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astro's Universal Web</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      color: #fff;
      background: radial-gradient(ellipse at top, #302052, #100d27 70%);
    }

    main {
      width: min(100%, 620px);
      text-align: center;
    }

    h1 {
      color: #d7b8ff;
      font-size: clamp(2rem, 7vw, 3.2rem);
      margin-bottom: 8px;
    }

    p { color: #c9c2df; }

    form {
      display: flex;
      gap: 10px;
      margin-top: 28px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #7662a8;
      border-radius: 12px;
      background: #211b3b;
      color: white;
      font: inherit;
    }

    button {
      padding: 14px 20px;
      border: 0;
      border-radius: 12px;
      background: #b99aff;
      color: #180e2b;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #message {
      min-height: 24px;
      margin-top: 18px;
      font-size: 0.9rem;
    }

    @media (max-width: 420px) {
      form { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Astro's Universal Web</h1>
    <p>Your gateway to the web, among the stars.</p>

    <form id="address-form">
      <input
        id="address"
        type="url"
        placeholder="https://example.com"
        aria-label="Website address"
        required
      >
      <button type="submit">Go</button>
    </form>

    <p id="message">
      Astro is ready to launch. Browsing service not connected yet.
    </p>
  </main>

  <script>
    document.getElementById("address-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const address = document.getElementById("address").value;
      document.getElementById("message").textContent =
        "Website entered: " + address +
        ". Connect the server browsing backend to open pages here.";
    });
  </script>
</body>
</html>
